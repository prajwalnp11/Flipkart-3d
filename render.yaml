services:
  # =========================================================================
  # 1. Django REST Framework Backend Web Service
  # =========================================================================
  - type: web
    name: flipkart-3d-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"

  # =========================================================================
  # 2. Vite + React Three Fiber Frontend Static Site
  # =========================================================================
  - type: web
    name: flipkart-3d-frontend
    runtime: static
    region: oregon
    branch: main
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://flipkart-3d-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://flipkart-3d-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
